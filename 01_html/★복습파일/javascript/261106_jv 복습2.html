<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    for (let x = 1; x <= 10; x++) {
      if (x % 2 == 0) {
        document.write(`<div style="background-color:red">${x}</div>`);
      } else {
        document.write(`<div style="background-color:blue">${x}</div>`);
      }
    }
  </script>
</body>

</html>
