<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      margin: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    img {
      width: 300px;
    }

    #inline img:nth-child(2) {
      visibility: hidden;
    }

    #block img {
      display: block;
    }

    #block img:nth-child(2) {
      display: none;
    }

    ul {
      width: 500px;
      margin: 0 auto;
      background: #ccc;
    }

    li {
      background: khaki;
      width: 100px;
      display: inline;
      display: inline-block;
    }

    a {
      color: inherit; /* 컬러 인헤리트 자주씀 (부모 컬러 상속) */
      text-decoration: none;
      background: lightcoral;
    }
  </style>
</head>

<body>
  <div id="inline">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgCuPSyvCK9WJ1r678vhNg_qlHLGD9_59c7ctZ4Yxt_wBI_aDJCAtILk&s=10"
      alt="전정국">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgCuPSyvCK9WJ1r678vhNg_qlHLGD9_59c7ctZ4Yxt_wBI_aDJCAtILk&s=10"
      alt="전정국">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgCuPSyvCK9WJ1r678vhNg_qlHLGD9_59c7ctZ4Yxt_wBI_aDJCAtILk&s=10"
      alt="전정국">
  </div>
  <div id="block">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgCuPSyvCK9WJ1r678vhNg_qlHLGD9_59c7ctZ4Yxt_wBI_aDJCAtILk&s=10"
      alt="전정국">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgCuPSyvCK9WJ1r678vhNg_qlHLGD9_59c7ctZ4Yxt_wBI_aDJCAtILk&s=10"
      alt="전정국">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgCuPSyvCK9WJ1r678vhNg_qlHLGD9_59c7ctZ4Yxt_wBI_aDJCAtILk&s=10"
      alt="전정국">
  </div>
  <nav>
    <ul>
      <li><a href="">메뉴1</a></li>
      <li><a href="">메뉴2</a></li>
      <li><a href="">메뉴3</a></li>
      <li><a href="">메뉴4</a></li>
    </ul>
  </nav>
</body>

</html>
