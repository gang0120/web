<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text-shadow 속성</title>
  <style>
    .ex {
      margin: 1px;
      border: 1px solid #ccc;
    }

    .s1 {
      font-size: 50px;
      text-shadow: 10px 10px 3px #f00;
    }

    .s2 {
      font-size: 100px;
      color: orange;
      text-shadow: -2px -2px 10px blue;
    }

    .s3 {
      font-size: 100px;
      color: green;
      text-shadow: 5px 10px 100px black;
    }

    .s4 {
      font-size: 150px;
      color: aliceblue;
      text-shadow: -5px -8px 50px black;
    }

    .s5 {
      font-size: 50px;
      color: magenta;
      text-shadow: 2px 2px 4px yellow;
    }
  </style>
</head>

<body>
  <h1>text-shadow 속성</h1>
  <p>텍스트에 그림자 효과를 추가하는 속성</p>
  <p>text-shadow : 가로거리 세로거리 번짐정도 색상</p>
  <div class="ex">
    <h2 class="s1">HTML5</h2>
    <h2 class="s2">HTML5</h2>
    <h2 class="s3">HTML5</h2>
    <h2 class="s4">HTML5</h2>
    <h2 class="s5">HTML5</h2>
  </div>
</body>

</html>
